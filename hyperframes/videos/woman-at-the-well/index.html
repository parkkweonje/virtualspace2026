<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "HF Gaegu";
        src: url("assets/fonts/gaegu-bold.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "HF Batang";
        src: url("assets/fonts/gowunbatang-bold.woff2") format("woff2");
        font-weight: 700;
      }
      :root {
        --paper: #eee9dd;
        --ink: #2b2433;
        --cream: #f7f0e1;
        --gold: #f2b84b;
        --teal: #6fd6cf;
        --crimson: #9e2f2e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
      }
      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .fade,
      .bg,
      .world,
      .flood {
        position: absolute;
        inset: 0;
      }
      .world {
        transform-origin: 50% 50%;
      }
      .world svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .flood {
        opacity: 0;
        pointer-events: none;
      }
      .ink {
        fill: none;
        stroke: var(--ink);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .rough {
        filter: url(#rough);
      }
      .crayon {
        filter: url(#crayon);
      }
      .nofx .rough,
      .nofx .crayon {
        filter: none;
      }
      .halo {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }

      .cap {
        position: absolute;
        left: 130px;
        bottom: 104px;
        max-width: 1320px;
        color: var(--cream);
      }
      .cap.top {
        bottom: auto;
        top: 110px;
      }
      .cap .day {
        display: block;
        font-family: "HF Gaegu", sans-serif;
        font-weight: 700;
        font-size: 76px;
        line-height: 1;
        color: var(--gold);
      }
      .cap .verse {
        display: block;
        margin-top: 18px;
        font-family: "HF Batang", serif;
        font-weight: 700;
        font-size: 50px;
        line-height: 1.35;
      }
      .cap .ref {
        display: block;
        margin-top: 14px;
        font-family: "HF Batang", serif;
        font-weight: 700;
        font-size: 32px;
        color: #d9cfbd;
      }
      .cap.big .verse {
        font-size: 104px;
        line-height: 1.1;
      }
      .cap.light {
        color: var(--ink);
      }
      .cap.light .day {
        color: var(--crimson);
      }
      .cap.light .ref {
        color: #4a3f52;
      }
      .title {
        position: absolute;
        left: 140px;
        top: 130px;
        color: var(--ink);
      }
      .title .main {
        display: block;
        font-family: "HF Gaegu", sans-serif;
        font-weight: 700;
        font-size: 128px;
        line-height: 1;
      }
      .title .sub {
        display: block;
        margin-top: 22px;
        font-family: "HF Batang", serif;
        font-weight: 700;
        font-size: 42px;
        color: #5a4a3e;
      }
      .title .sub b {
        color: #1f7f86;
        font-weight: 700;
      }
      .grain {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        mix-blend-mode: soft-light;
        opacity: 0.55;
      }
      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(20, 12, 30, 0.26) 100%);
      }
    </style>
  </head>

    <script>
      (function () {
        const NS = "http://www.w3.org/2000/svg";
        const INK = "#2b2433";
        const $ = (s) => document.querySelector(s);
        function rng(seed) {
          let a = seed >>> 0;
          return function () {
            a = (a + 0x6d2b79f5) >>> 0;
            let t = a;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        function el(tag, attrs, parent) {
          const n = document.createElementNS(NS, tag);
          for (const k in attrs) n.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(n);
          return n;
        }

        // ---------- water jar (origin = base centre) ----------
        function buildJar(root, opts) {
          const o = Object.assign({ x: 0, y: 0, s: 1, mouth: "#142033", fill: "#c9774a" }, opts);
          const outer = el("g", { transform: `translate(${o.x} ${o.y}) scale(${o.s})` }, root);
          const g = el("g", {}, outer);
          const body = "M -60 0 C -110 -20, -130 -110, -110 -170 C -96 -210, -60 -232, -44 -250 L -44 -280 L 44 -280 L 44 -250 C 60 -232, 96 -210, 110 -170 C 130 -110, 110 -20, 60 0 Z";
          el("path", { d: body, fill: o.fill, stroke: "none" }, g);
          el("path", { d: body, fill: o.fill, stroke: INK, "stroke-width": 6, class: "crayon" }, g);
          el("path", { d: "M -112 -150 C -60 -136, 60 -136, 112 -150", fill: "none", stroke: "#8e4b2c", "stroke-width": 5 }, g);
          el("path", { d: "M -100 -110 C -50 -98, 50 -98, 100 -110", fill: "none", stroke: "#8e4b2c", "stroke-width": 4, "stroke-dasharray": "14 12" }, g);
          el("path", { d: "M -44 -250 C -90 -250, -104 -210, -96 -186", fill: "none", stroke: INK, "stroke-width": 6, "stroke-linecap": "round" }, g);
          el("path", { d: "M 44 -250 C 90 -250, 104 -210, 96 -186", fill: "none", stroke: INK, "stroke-width": 6, "stroke-linecap": "round" }, g);
          el("ellipse", { cx: 0, cy: -282, rx: 58, ry: 15, fill: "#b8653c", stroke: INK, "stroke-width": 5 }, g);
          const mouth = el("ellipse", { cx: 0, cy: -282, rx: 42, ry: 9, fill: o.mouth }, g);
          el("path", { d: "M -70 -60 C -76 -90, -74 -130, -60 -150", fill: "none", stroke: "#e8a77a", "stroke-width": 7, "stroke-linecap": "round", opacity: 0.8 }, g);
          return { outer, g, mouth };
        }

        // ---------- woman silhouette (faces +x, origin = feet) ----------
        function buildWoman(root, withJar) {
          const feet = [];
          [-22, 18].forEach((x) => feet.push(el("ellipse", { cx: x, cy: -4, rx: 18, ry: 8, fill: "#6b4a3a", stroke: INK, "stroke-width": 3 }, root)));
          const body = el("g", {}, root);
          const robe = "M -40 -250 C -62 -180, -74 -80, -84 -6 L 84 -6 C 74 -80, 58 -180, 38 -250 Z";
          el("path", { d: robe, fill: "#5b6fa8", stroke: "none" }, body);
          el("path", { d: robe, fill: "#5b6fa8", stroke: INK, "stroke-width": 5, class: "crayon" }, body);
          el("path", { d: "M -66 -110 C -20 -100, 30 -100, 72 -112", fill: "none", stroke: "#3e4c7e", "stroke-width": 5 }, body);
          el("ellipse", { cx: 12, cy: -282, rx: 26, ry: 30, fill: "#c99a78", stroke: INK, "stroke-width": 4 }, body);

        tl.fromTo("#s1-heat", { x: -30, opacity: 0.2 }, { x: 30, opacity: 0.6, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 2 }, 5.4);
        tl.fromTo("#s1-woman", { x: 0 }, { x: 1180, duration: 3.8, ease: "none" }, 5.4);
        walk(w1, 5.4, 10, 0.38, 6);
        capIn("#s1-cap", 5.9);
        capOut("#s1-cap", 9.2);
        cam.s1.move(tl, { ox: 0, oy: 160 - 540, s0: 1, s1: 26, c0: 0, c1: 1, at: 9.2, dur: 1.0, ease: "power2.in" });
        tl.fromTo("#s1-flood", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.in" }, 9.85);

        // ===== S2 (10.0 – 15.5) =====
        fadeIn("#s2", 10.1, 0.4);
        cam.s2.move(tl, { ox: 0, oy: 0, s0: 1.12, s1: 1, c0: 0, c1: 0, at: 10.1, dur: 1.4, ease: "power2.out" });
        tl.fromTo("#s2-halo", { scale: 0.92, opacity: 0.85 }, { scale: 1.06, opacity: 1, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 3 }, 10.1);
        tl.fromTo("#s2-woman", { x: -300 }, { x: 0, duration: 1.9, ease: "power1.out" }, 10.3);
        walk(w2, 10.3, 5, 0.38, 6);
        tl.fromTo(j2.arm, { rotation: 0, svgOrigin: "22 -250" }, { rotation: -38, svgOrigin: "22 -250", duration: 0.5, ease: "back.out(2)" }, 12.2);
        capIn("#s2-cap", 12.3);
        tl.fromTo(w2.jar.outer, { y: 0, x: 0 }, { y: 340, x: 90, duration: 0.5, ease: "power2.inOut" }, 13.1);
        tl.fromTo(w2.arm, { rotation: 0, svgOrigin: "18 -236" }, { rotation: 50, svgOrigin: "18 -236", duration: 0.5, ease: "power2.inOut" }, 13.1);
        tl.fromTo("#s2-woman", { x: 0 }, { x: -24, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 13.5);
        tl.fromTo("#s2-marks", { opacity: 0, scale: 0.6, svgOrigin: "1300 560" }, { opacity: 1, scale: 1, svgOrigin: "1300 560", duration: 0.25, ease: "back.out(3)" }, 13.5);
        capOut("#s2-cap", 14.35);
        tl.to("#s2-marks", { opacity: 0, duration: 0.2 }, 14.35);
        cam.s2.move(tl, { ox: 980 - 960, oy: 645 - 540, s0: 1, s1: 40, c0: 0, c1: 1, at: 14.35, dur: 1.0, ease: "power2.in" });

        // ===== S3 (15.2 – 20.4) — down the well =====
        fadeIn("#s3", 15.3, 0.3);
        tl.fromTo("#s3-rings", { scale: 1, rotation: 0, svgOrigin: "960 540" }, { scale: 1.7, rotation: 25, svgOrigin: "960 540", duration: 5.2, ease: "sine.inOut" }, 15.2);
        tl.fromTo("#s3-bucket", { y: -160, scale: 1.4, svgOrigin: "0 0" }, { y: 470, scale: 0.18, svgOrigin: "0 0", duration: 2.8, ease: "power2.in" }, 15.5);
        tl.fromTo("#s3-rope", { attr: { y2: -40 } }, { attr: { y2: 490 }, duration: 2.8, ease: "power2.in" }, 15.5);
        capIn("#s3-cap", 15.9);
        ripples.forEach((r, i) => tl.fromTo(r, { attr: { rx: 10, ry: 10 }, opacity: 0.9 }, { attr: { rx: 70 + i * 10, ry: 70 + i * 10 }, opacity: 0, duration: 1.1, ease: "power2.out" }, 18.3 + i * 0.18));
        tl.fromTo("#s3-glint", { opacity: 0.6, scale: 1, svgOrigin: "975 530" }, { opacity: 1, scale: 1.5, svgOrigin: "975 530", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 15.4);
        capOut("#s3-cap", 19.25);
        cam.s3.move(tl, { ox: 0, oy: 0, s0: 1, s1: 40, c0: 0, c1: 1, at: 19.25, dur: 1.0, ease: "power2.in" });
        tl.fromTo("#s3-flood", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.in" }, 19.85);

        // ===== S4 (20.1 – 26.2) — living water =====
        fadeIn("#s4", 20.15, 0.45);
        tl.fromTo("#s4-column", { scaleY: 0, svgOrigin: `${SRC.x} ${SRC.y}` }, { scaleY: 1, svgOrigin: `${SRC.x} ${SRC.y}`, duration: 0.7, ease: "back.out(1.6)" }, 20.4);
        tl.to("#s4-column", { scaleX: 1.15, svgOrigin: `${SRC.x} ${SRC.y}`, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 15 }, 21.1);
        tl.fromTo("#s4-halo", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.0, ease: "power2.out" }, 20.4);
        streams.forEach((s, i) => {
          tl.fromTo([s.p, s.glow], { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.1, ease: "power2.out" }, 20.9 + i * 0.16);
        });
        flowers.forEach((f, i) => tl.fromTo(f, { scale: 0, rotation: -60, svgOrigin: "0 0" }, { scale: 1, rotation: 0, svgOrigin: "0 0", duration: 0.45, ease: "back.out(2.6)" }, 21.9 + i * 0.09));
        bubbles.forEach((b) => tl.fromTo(b.c, { y: 0, x: 0, opacity: 0 }, { y: -b.rise, x: b.dx, opacity: 0.8, duration: b.d, ease: "sine.out", repeat: Math.max(0, Math.floor(4.4 / b.d) - 1) }, 20.6 + b.t));
        capIn("#s4-cap", 21.3);
        capOut("#s4-cap", 25.2);
        tl.fromTo("#s4-flood", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.in" }, 25.3);

        // ===== S5 (25.7 – 31.5) — "I am he" =====
        fadeIn("#s5", 25.8, 0.45);
        tl.fromTo("#s5-rays", { rotation: 0, scale: 0.5, svgOrigin: "0 0" }, { rotation: 20, scale: 1, svgOrigin: "0 0", duration: 5.6, ease: "power1.out" }, 25.8);
        tl.fromTo(j5.arm, { rotation: 0, svgOrigin: "22 -250" }, { rotation: -60, svgOrigin: "22 -250", duration: 0.6, ease: "back.out(1.8)" }, 26.4);
        capIn("#s5-cap", 26.6);
        tl.fromTo(w5.jar.outer, { y: 0, x: 0 }, { y: 745, x: 230, duration: 0.6, ease: "power2.inOut" }, 28.3);
        tl.fromTo(w5.arm, { rotation: 0, svgOrigin: "18 -236" }, { rotation: 70, svgOrigin: "18 -236", duration: 0.6, ease: "power2.inOut" }, 28.3);
        tl.fromTo(w5.body, { scaleY: 1, svgOrigin: "0 0" }, { scaleY: 0.9, svgOrigin: "0 0", duration: 0.5, ease: "power2.out" }, 28.9);
        // push right → next scene enters from the left
        capOut("#s5-cap", 30.4);
        tl.to("#s5-fade", { x: 1920, duration: 0.6, ease: "power3.in" }, 30.75);

        // ===== S6 (30.9 – 36.5) — "Come, see" =====
        tl.fromTo("#s6-fade", { x: -1920 }, { x: 0, duration: 0.6, ease: "power3.out" }, 31.0);
        tl.fromTo("#s6-woman", { x: 0 }, { x: 1400, duration: 2.0, ease: "power1.in" }, 31.4);
        walk(w6, 31.4, 8, 0.25, 10);
        people.forEach((p) => {
          tl.fromTo(p.p, { x: 0, y: 0, opacity: 0 }, { x: p.dist, y: p.dy, opacity: 1, duration: p.dur, ease: "power1.inOut" }, 33.1 + p.t);
          tl.fromTo(p.p, { rotation: -3, svgOrigin: "0 0" }, { rotation: 3, svgOrigin: "0 0", duration: 0.22, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor(p.dur / 0.22) - 1) }, 33.1 + p.t);
        });
        wheat.forEach((w) => tl.fromTo(w.s, { rotation: -4, svgOrigin: "0 0" }, { rotation: 4, svgOrigin: "0 0", duration: 0.9 + w.ph * 0.4, ease: "sine.inOut", yoyo: true, repeat: 4 }, 31.0 + w.ph * 0.4));
        capIn("#s6-cap", 31.7);
        capOut("#s6-cap", 35.6);
        tl.fromTo("#s6-flood", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.in" }, 35.6);

        // ===== S7 (36.1 – 42) — the jar overflows =====
        fadeIn("#s7", 36.15, 0.35);
        cam.s7.move(tl, { ox: MOUTH7.x - 960, oy: MOUTH7.y - 540, s0: 90, s1: 1, c0: 1, c1: 0, at: 36.1, dur: 1.6, ease: "power3.out" });
        overs.forEach((o, i) => tl.fromTo(o, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, ease: "power1.in" }, 37.3 + i * 0.1));
        tl.fromTo(pool, { opacity: 0, attr: { rx: 40 } }, { opacity: 0.85, attr: { rx: 300 }, duration: 1.2, ease: "power2.out" }, 38.1);
        sprouts.forEach((s, i) => tl.fromTo(s, { scaleY: 0, svgOrigin: "0 0" }, { scaleY: 1, svgOrigin: "0 0", duration: 0.5, ease: "back.out(2)" }, 38.3 + i * 0.12));
        sparks.forEach((s, i) => {
          tl.fromTo(s, { scale: 0, rotation: -30, svgOrigin: "0 0" }, { scale: 1, rotation: 0, svgOrigin: "0 0", duration: 0.4, ease: "back.out(2.6)" }, 38.6 + i * 0.1);
          tl.to(s, { rotation: 25, svgOrigin: "0 0", duration: 2.0, ease: "sine.inOut" }, 39.0 + i * 0.1);
        });
        tl.fromTo("#s7-title .main", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "back.out(1.4)" }, 38.6);
        tl.fromTo("#s7-title .sub", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "sine.out" }, 39.2);

        window.__timelines["main"] = tl;
      })();
