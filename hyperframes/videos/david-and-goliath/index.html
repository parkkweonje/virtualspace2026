<!doctype html>
<html lang="ko" data-resolution="landscape">

    <style>
      @font-face {
        font-family: "HF Gaegu";
        src: url("assets/fonts/gaegu-bold.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "HF Batang";
        src: url("assets/fonts/gowunbatang-bold.woff2") format("woff2");
        font-weight: 700;
      }
      :root {
        --paper: #eee9dd;
        --ink: #2b2433;
        --cream: #f7f0e1;
        --gold: #f2b84b;
        --crimson: #9e2f2e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
      }
      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .fade,
      .bg,
      .world,
      .shake,
      .flood {
        position: absolute;
        inset: 0;
      }
      .world {
        transform-origin: 50% 50%;
      }
      .world svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .flood {
        opacity: 0;
        pointer-events: none;
      }
      .ink {
        fill: none;
        stroke: var(--ink);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .rough {
        filter: url(#rough);
      }
      .crayon {
        filter: url(#crayon);
      }
      .nofx .rough,
      .nofx .crayon {
        filter: none;
      }
      .halo {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }
      .cap {
        position: absolute;
        left: 130px;
        bottom: 104px;
        max-width: 1320px;
        color: var(--cream);
      }
      .cap.top {
        bottom: auto;
        top: 110px;
      }
      .cap .day {
        display: block;
        font-family: "HF Gaegu", sans-serif;
        font-weight: 700;
        font-size: 76px;
        line-height: 1;
        color: var(--gold);
      }
      .cap .verse {
        display: block;
        margin-top: 18px;
        font-family: "HF Batang", serif;
        font-weight: 700;
        font-size: 50px;
        line-height: 1.35;
      }
      .cap .ref {
        display: block;
        margin-top: 14px;
        font-family: "HF Batang", serif;
        font-weight: 700;
        font-size: 32px;
        color: #d9cfbd;
      }
      .cap.big .verse {
        font-size: 96px;
        line-height: 1.1;
      }
      .cap.light {
        color: var(--ink);
      }
      .cap.light .day {
        color: var(--crimson);
      }
      .cap.light .ref {
        color: #4a3f52;
      }
      .title {
        position: absolute;
        left: 140px;
        top: 130px;
        color: var(--ink);
      }
      .title .main {
        display: block;
        font-family: "HF Gaegu", sans-serif;
        font-weight: 700;
        font-size: 128px;
        line-height: 1;
      }
      .title .sub {
        display: block;
        margin-top: 22px;
        font-family: "HF Batang", serif;
        font-weight: 700;
        font-size: 42px;
        color: #5a4a3e;
      }
      .title .sub b {
        color: var(--crimson);
        font-weight: 700;
      }
      .grain {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        mix-blend-mode: soft-light;
        opacity: 0.55;
      }
      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(20, 12, 30, 0.26) 100%);
      }
    </style>
  </head>

    <script>
      (function () {
        const NS = "http://www.w3.org/2000/svg";
        const INK = "#2b2433";
        const $ = (s) => document.querySelector(s);
        function rng(seed) {
          let a = seed >>> 0;
          return function () {
            a = (a + 0x6d2b79f5) >>> 0;
            let t = a;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        function el(tag, attrs, parent) {
          const n = document.createElementNS(NS, tag);
          for (const k in attrs) n.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(n);
          return n;
        }

        // ---------- a smooth stone (origin = centre) ----------
        function buildStone(root, s, fill, hi) {
          const g = el("g", { transform: `scale(${s})` }, root);
          const d = "M -118 10 C -122 -46, -60 -78, 6 -76 C 74 -74, 124 -40, 120 8 C 116 56, 60 76, -4 74 C -70 72, -114 52, -118 10 Z";
          el("path", { d, fill, stroke: "none" }, g);
          el("path", { d, fill, stroke: INK, "stroke-width": 6, class: "crayon" }, g);
          el("path", { d: "M -70 -30 C -40 -54, 10 -60, 50 -48", fill: "none", stroke: hi, "stroke-width": 10, "stroke-linecap": "round", opacity: 0.8 }, g);
          el("ellipse", { cx: 40, cy: -40, rx: 14, ry: 8, fill: "#ffffff", opacity: 0.85 }, g);
          return g;
        }

        // ---------- Goliath (faces -x, origin = feet) ----------
        function buildGoliath(root, flat) {
          const B = flat || "#b07a3c", D = flat || "#7a5228", C = flat || "#6b3b3b", S = flat || "#b98863";
          const stroke = flat ? "none" : INK;
          const g = el("g", {}, root);
          const spearArm = el("g", {}, g);
          el("path", { d: "M 150 -560 C 180 -520, 196 -470, 196 -420", fill: "none", stroke: S, "stroke-width": 40, "stroke-linecap": "round" }, spearArm);
          el("rect", { x: 186, y: -930, width: 16, height: 860, fill: flat || "#6b4a2a", stroke, "stroke-width": 3 }, spearArm);
          el("path", { d: "M 194 -1010 L 220 -930 L 168 -930 Z", fill: flat || "#c9c4b8", stroke, "stroke-width": 4 }, spearArm);
          el("circle", { cx: 196, cy: -420, r: 26, fill: S, stroke, "stroke-width": 4 }, spearArm);
          const body = el("g", {}, g);
          [[-75, 0], [25, 0]].forEach(([x]) => {
            el("rect", { x, y: -270, width: 50, height: 260, rx: 12, fill: B, stroke, "stroke-width": 5 }, body);
            el("ellipse", { cx: x + 18, cy: -8, rx: 46, ry: 16, fill: D, stroke, "stroke-width": 4 }, body);
          });
          el("path", { d: "M -115 -260 L 115 -260 L 132 -340 L -132 -340 Z", fill: C, stroke, "stroke-width": 5 }, body);
          if (!flat) for (let i = -4; i <= 4; i++) el("path", { d: `M ${i * 26} -262 L ${i * 29} -338`, stroke: "#4a2626", "stroke-width": 4 }, body);
          el("path", { d: "M -132 -340 L 132 -340 L 152 -566 C 120 -610, -120 -610, -152 -566 Z", fill: B, stroke, "stroke-width": 6, class: flat ? "" : "crayon" }, body);
          if (!flat) for (let r = 0; r < 6; r++) for (let c = -5; c <= 5; c++) {
            const x = c * 24 + (r % 2) * 12, y = -380 - r * 34;
            if (Math.abs(x) < 120 + r * 4) el("path", { d: `M ${x - 11} ${y} A 11 11 0 0 0 ${x + 11} ${y}`, fill: "none", stroke: D, "stroke-width": 3 }, body);
          }
